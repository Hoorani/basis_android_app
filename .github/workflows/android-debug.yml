name: Android Debug Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  debug-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Verify Java installation
      run: |
        java -version
        echo "JAVA_HOME: $JAVA_HOME"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Verify Gradle wrapper
      run: |
        ls -la gradle/wrapper/
        ./gradlew --version
        ./gradlew --help

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: List project structure
      run: |
        echo "=== Project Structure ==="
        find . -name "*.gradle" -o -name "*.xml" -o -name "*.kt" | head -20
        echo "=== Gradle files ==="
        ls -la *.gradle
        ls -la app/*.gradle

    - name: Check Gradle configuration
      run: |
        echo "=== Gradle wrapper properties ==="
        cat gradle/wrapper/gradle-wrapper.properties
        echo "=== Root build.gradle ==="
        cat build.gradle
        echo "=== App build.gradle ==="
        cat app/build.gradle

    - name: Try Gradle tasks
      run: ./gradlew tasks --all

    - name: Try clean task
      run: ./gradlew clean --stacktrace

    - name: Try assembleDebug with full output
      run: ./gradlew assembleDebug --stacktrace --info --debug
      continue-on-error: true

    - name: Check build directory after failure
      if: failure()
      run: |
        echo "=== Build directory contents ==="
        find . -name "build" -type d
        ls -la app/ || echo "app directory not found"
        ls -la app/build/ || echo "app/build directory not found"

    - name: Upload any build outputs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: debug-outputs
        path: |
          app/build/
          build/
        retention-days: 30
